<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
	html, body {
		margin: 0;
		padding: 0;
		background: #ffffff;
	}
	body {
		width: 320px;
		height: 240px;
	}
	#box {
		box-sizing: border-box;
		position: absolute;
		left: 40px;
		top: 30px;
		width: 80px;
		height: 40px;
		background: #00aa00;
		transform: skewX(45deg);
	}
</style>
</head>
<body data-id="root">
	<div id="box" data-id="box"></div>
</body>
