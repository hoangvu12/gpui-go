<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
	html, body {
		margin: 0;
		padding: 0;
		background: #ffffff;
	}
	body {
		width: 640px;
		height: 400px;
		position: relative;
	}
	button {
		appearance: none;
		border: 0;
		margin: 0;
		padding: 0;
		display: block;
		position: absolute;
		width: 40px;
		height: 20px;
		background: #2563eb;
		outline: none;
	}
	#b1 {
		left: 0px;
		top: 0px;
	}
	/* The UA stylesheet centers popovers (position: fixed; inset: 0;
	   margin: auto; border; padding), so the pages reset all of it back
	   to plain fixed boxes (html.css:1966-1977). */
	.hint {
		position: fixed;
		inset: auto;
		margin: 0;
		border: 0;
		padding: 0;
		overflow: visible;
	}
	#anchor {
		left: 600px;
		top: 0px;
		background: #94a3b8;
	}
	#tip {
		left: 0px;
		top: 24px;
		width: 120px;
		height: 60px;
		background: #fde68a;
	}
</style>
</head>
<body data-id="root" data-events="keydown,keyup">
	<button id="b1" interestfor="tip" data-id="b1" tabindex="0"></button>
	<button id="anchor" data-id="anchor" tabindex="0"></button>
	<div id="tip" class="hint" popover="hint" data-id="tip"></div>
</body>
</html>
