<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
	html, body {
		margin: 0;
		padding: 0;
		background: #ffffff;
	}
	body {
		width: 640px;
		height: 350px;
		display: flex;
		flex-direction: column;
		gap: 12px;
		padding: 16px;
		box-sizing: border-box;
		/* The pinned 25px line height (the textstyle fixtures' rule:
		   the two sides' baseline placement agree at 25px). */
		font: 16px/25px "Segoe UI", system-ui, sans-serif;
		color: #0f172a;
	}
	.row {
		box-sizing: border-box;
		width: 380px;
		padding: 8px;
		border: 1px solid #334155;
		background: #e2e8f0;
		display: flex;
	}
	.fill {
		box-sizing: border-box;
		background: #dbeafe;
	}

</style>
</head>
<body data-id="root">
	<div class="row" data-id="row-normal"><span class="fill" data-id="span-normal" style="display: block; width: 100%; white-space: normal">Alpha   beta

gamma</span></div>
	<div class="row" data-id="row-leaf"><span class="fill" data-id="span-leaf" style="display: flex; width: 100%; white-space: normal">Alpha   beta

gamma</span></div>
	<div class="row" data-id="row-styled"><span class="fill" data-id="span-styled" style="display: flex; width: 100%; white-space: normal">Alpha   beta

gamma</span></div>
	<div class="row" data-id="row-spans"><span class="fill" data-id="span-spans" style="display: block; width: 100%; white-space: normal"><span>Alpha   </span><span> beta</span></span></div>
	<div class="row" data-id="row-preline"><span class="fill" data-id="span-preline" style="display: block; width: 100%; white-space: pre-line">Alpha   beta
gamma</span></div>
	<div class="row" data-id="row-empty"><span class="fill" data-id="span-empty" style="display: block; width: 100%; white-space: normal">   
	 </span></div>
</body>
</html>
