<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
	html, body {
		margin: 0;
		padding: 0;
		background: #ffffff;
	}
	body {
		width: 640px;
		height: 400px;
		display: flex;
		flex-direction: column;
		padding: 24px;
		box-sizing: border-box;
		font: 16px/1.618 "Segoe UI", system-ui, sans-serif;
	}
	#dashed {
		box-sizing: border-box;
		width: 200px;
		height: 100px;
		background: #e2e8f0;
		outline: 2px dashed #334155;
		outline-offset: 4px;
	}
</style>
</head>
<body data-id="root">
	<div id="dashed" data-id="dashed"></div>
</body>
</html>
