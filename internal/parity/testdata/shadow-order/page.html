<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
	html, body {
		margin: 0;
		padding: 0;
		background: #ffffff;
	}
	body {
		width: 640px;
		height: 400px;
		display: flex;
		align-items: center;
		justify-content: center;
	}
	.card {
		width: 202px;
		height: 142px;
		display: flex;
		align-items: center;
		justify-content: center;
	}
	.box {
		width: 160px;
		height: 100px;
		background: #0f172e;
		/* The FIRST shadow (the red halo) paints on top where the two
		   shadows overlap, at the box's bottom-right corner. */
		box-shadow: 0 0 0 10px rgba(220, 38, 38, 0.4), 28px 28px 0 0 rgba(37, 99, 235, 0.6);
	}
</style>
</head>
<body>
	<div class="card" data-id="order-card"><div class="box" data-id="order-box"></div></div>
</body>
</html>
