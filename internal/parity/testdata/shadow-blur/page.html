<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
	html, body {
		margin: 0;
		padding: 0;
		background: #ffffff;
	}
	body {
		width: 640px;
		height: 400px;
		display: flex;
		align-items: center;
		justify-content: center;
	}
	.card {
		width: 312px;
		height: 232px;
		display: flex;
		align-items: center;
		justify-content: center;
	}
	.box {
		width: 200px;
		height: 120px;
		background: #ffffff;
		/* CSS: sigma = blur / 2, so 24px of blur is a 12px-sigma Gaussian. */
		box-shadow: 14px 18px 24px rgba(15, 23, 42, 0.4);
	}
</style>
</head>
<body>
	<div class="card" data-id="blur-card"><div class="box" data-id="blur-box"></div></div>
</body>
</html>
