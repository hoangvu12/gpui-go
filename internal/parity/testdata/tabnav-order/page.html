<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
	html, body {
		margin: 0;
		padding: 0;
		background: #ffffff;
	}
	body {
		width: 480px;
		height: 360px;
		display: flex;
		flex-direction: column;
		font: 16px/1.618 "Segoe UI", system-ui, sans-serif;
	}
	div[id] {
		box-sizing: border-box;
		width: 120px;
		height: 60px;
		background: #e2e8f0;
	}
	div[id]:focus {
		background: #22c55e;
		outline: none;
	}
</style>
</head>
<body data-id="root">
	<div id="z2" data-id="z2" tabindex=0></div>
	<div id="p2" data-id="p2" tabindex=2></div>
	<div id="z1" data-id="z1" tabindex=0></div>
	<div id="p1" data-id="p1" tabindex=1></div>
	<div id="n" data-id="n" tabindex=-1></div>
</body>
</html>
