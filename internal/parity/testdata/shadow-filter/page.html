<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
	html, body {
		margin: 0;
		padding: 0;
		background: #ffffff;
	}
	body {
		width: 640px;
		height: 400px;
		display: flex;
		align-items: center;
		justify-content: center;
	}
	.card {
		width: 276px;
		height: 206px;
		display: flex;
		align-items: center;
		justify-content: center;
	}
	.box {
		box-sizing: border-box;
		width: 180px;
		height: 110px;
		background: #ffffff;
		border: 2px solid #334155;
		/* The filter applies to the whole element, box-shadow included. */
		box-shadow: 10px 12px 18px rgba(15, 23, 42, 0.4);
		filter: blur(3px);
		display: flex;
		align-items: center;
		justify-content: center;
	}
	.swatch {
		width: 120px;
		height: 24px;
		background: #16a34a;
	}
</style>
</head>
<body>
	<div class="card" data-id="filter-card">
		<div class="box" data-id="filter-box"><div class="swatch"></div></div>
	</div>
</body>
</html>
