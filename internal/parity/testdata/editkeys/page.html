<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
	html, body {
		margin: 0;
		padding: 0;
		background: #ffffff;
	}
	body {
		width: 480px;
		height: 360px;
		display: flex;
		flex-direction: column;
		font: 16px/1.618 "Segoe UI", system-ui, sans-serif;
	}
	#field {
		appearance: none;
		display: block;
		box-sizing: border-box;
		width: 200px;
		height: 40px;
		padding: 0;
		border: none;
		margin: 0;
		background: #e2e8f0;
		color: transparent;
		caret-color: transparent;
		outline: none;
		font: 16px/1.618 "Segoe UI", system-ui, sans-serif;
	}
</style>
</head>
<body data-id="root" data-events="keydown,keyup">
	<input id="field" data-id="field" value="hello world">
</body>
</html>
