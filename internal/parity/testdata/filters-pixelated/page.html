<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
	html, body {
		margin: 0;
		padding: 0;
		background: #ffffff;
	}
	body {
		width: 640px;
		height: 400px;
		display: flex;
		align-items: center;
		justify-content: center;
		gap: 48px;
	}
	.cell img {
		display: block;
		box-sizing: border-box;
		width: 100px;
		height: 100px;
		object-fit: fill;
	}
	.pixelated img { image-rendering: pixelated; }
</style>
</head>
<body>
	<div class="cell" data-id="smooth"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAIAAABLbSncAAAAL0lEQVR42mK6o6amdDTOuunbrzOiyGwGrKJ31NQYsIoqHY1jwCpq3fSNgQ52AAYAb4NfswrbIscAAAAASUVORK5CYII="></div>
	<div class="cell pixelated" data-id="pixelated"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAIAAABLbSncAAAAL0lEQVR42mK6o6amdDTOuunbrzOiyGwGrKJ31NQYsIoqHY1jwCpq3fSNgQ52AAYAb4NfswrbIscAAAAASUVORK5CYII="></div>
</body>
</html>
