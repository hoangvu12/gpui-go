<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
	html, body {
		margin: 0;
		padding: 0;
		background: #ffffff;
	}
	body {
		width: 320px;
		height: 240px;
		display: flex;
		align-items: flex-start;
	}
	#scroller {
		box-sizing: border-box;
		width: 200px;
		height: 200px;
		margin-left: 10px;
		margin-top: 10px;
		display: flex;
		flex-direction: column;
		overflow-y: scroll;
		/* The port draws no scrollbars and reserves no gutter. */
		scrollbar-width: none;
		background: #f1f5f9;
	}
	#scroller > div {
		flex-shrink: 0;
		box-sizing: border-box;
		background: #cbd5e1;
	}
</style>
</head>
<body data-id="root">
	<div id="scroller" data-id="scroller">
		<div id="rrow0" data-id="rrow0" tabindex="0" style="width: 200px; height: 40px;
			background: #fca5a5;
			outline: none;"></div>
		<div id="rrow1" data-id="rrow1" style="width: 200px; height: 40px;"></div>
		<div id="rrow2" data-id="rrow2" style="width: 200px; height: 40px;"></div>
		<div id="rrow3" data-id="rrow3" style="width: 200px; height: 40px;"></div>
		<div id="rrow4" data-id="rrow4" style="width: 200px; height: 40px;"></div>
		<div id="rrow5" data-id="rrow5" style="width: 200px; height: 40px;"></div>
		<div id="rrow6" data-id="rrow6" style="width: 200px; height: 40px;"></div>
		<div id="rrow7" data-id="rrow7" style="width: 200px; height: 40px;"></div>
		<div id="rrow8" data-id="rrow8" style="width: 200px; height: 40px;"></div>
		<div id="rrow9" data-id="rrow9" style="width: 200px; height: 40px;"></div>
	</div>
</body>
</html>
