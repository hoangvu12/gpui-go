<style>
	html, body {
		margin: 0;
		padding: 0;
		background: #ffffff;
	}
	body {
		width: 640px;
		height: 400px;
		display: flex;
		align-items: center;
		justify-content: center;
	}
	.card {
		position: relative;
		box-sizing: border-box;
		width: 120px;
		height: 90px;
		/* The rounded overflow clip: the descendants (the image) clip
		   to the inner border rounded rect - here the border box with
		   the 36px radii. */
		border-radius: 36px;
		overflow: hidden;
	}
	.card img {
		display: block;
		width: 120px;
		height: 90px;
		object-fit: cover;
	}
</style>
