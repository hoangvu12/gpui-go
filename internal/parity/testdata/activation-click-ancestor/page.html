<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
	html, body {
		margin: 0;
		padding: 0;
		background: #ffffff;
	}
	body {
		width: 480px;
		height: 360px;
		display: flex;
		flex-direction: column;
		font: 16px/1.618 "Segoe UI", system-ui, sans-serif;
	}
	#p {
		box-sizing: border-box;
		width: 260px;
		height: 120px;
		display: flex;
		background: #e2e8f0;
	}
	#p.clicked {
		background: #86efac;
	}
	#a, #b {
		box-sizing: border-box;
		width: 100px;
		height: 80px;
	}
	#a {
		background: #fca5a5;
	}
	#b {
		background: #fda4af;
	}
</style>
</head>
<body data-id="root">
	<div id="p" data-id="p">
		<div id="a" data-id="a"></div>
		<div id="b" data-id="b"></div>
	</div>
	<script>
		document.getElementById("p").addEventListener("click", function () {
			this.classList.add("clicked");
		});
	</script>
</body>
</html>
