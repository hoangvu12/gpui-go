<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
	html, body {
		margin: 0;
		padding: 0;
		background: #ffffff;
	}
	body {
		width: 640px;
		height: 400px;
		position: relative;
	}
	button {
		appearance: none;
		border: 0;
		margin: 0;
		padding: 0;
		display: block;
		position: absolute;
		width: 40px;
		height: 20px;
		background: #2563eb;
		outline: none;
	}
	#b1 {
		left: 0px;
		top: 0px;
	}
	/* The UA stylesheet centers popovers (position: fixed; inset: 0;
	   margin: auto; border; padding), so the pages reset all of it back
	   to plain fixed boxes (html.css:1966-1977). */
	.hint {
		position: fixed;
		inset: auto;
		margin: 0;
		border: 0;
		padding: 0;
		overflow: visible;
	}
	#tip {
		left: 0px;
		top: 24px;
		width: 120px;
		height: 60px;
		background: #fde68a;
	}
</style>
</head>
<body data-id="root" data-events="keydown,keyup">
	<button id="b1" interestfor="tip" data-id="b1"></button>
	<div id="tip" class="hint" popover="hint" data-id="tip"></div>
	<script>
		window.__t = {};
		window.__t.page = performance.now();
		document.addEventListener("pointerover", () => {
			if (!window.__t.over) window.__t.over = performance.now();
		}, true);
		document.getElementById("tip").addEventListener("toggle", (e) => {
			if (e.newState === "open") window.__t.open = performance.now();
			else window.__t.close = performance.now();
		});
	</script>
</body>
</html>
