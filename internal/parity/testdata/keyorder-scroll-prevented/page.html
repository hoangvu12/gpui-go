<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
	html, body {
		margin: 0;
		padding: 0;
		background: #ffffff;
	}
	body {
		width: 480px;
		height: 360px;
		display: flex;
		flex-direction: column;
		font: 16px/1.618 "Segoe UI", system-ui, sans-serif;
	}
	#scroller {
		box-sizing: border-box;
		width: 200px;
		height: 200px;
		overflow-y: scroll;
		scrollbar-width: none;
		background: #e2e8f0;
	}
	#content {
		box-sizing: border-box;
		width: 200px;
		height: 1000px;
		display: flex;
		flex-direction: column;
	}
	#target {
		width: 200px;
		height: 50px;
		background: #fca5a5;
		outline: none;
	}
	#filler {
		width: 200px;
		height: 50px;
		background: #94a3b8;
	}
</style>
</head>
<body data-id="root">
	<div id="scroller" data-id="scroller">
		<div id="content" data-id="content">
			<div id="target" data-id="target" tabindex="0"></div>
			<div id="filler"></div>
		</div>
	</div>
	<script>
	document.addEventListener('keydown', e => e.preventDefault(), true);
	</script>
</body>
</html>
