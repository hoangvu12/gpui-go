<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
	html, body {
		margin: 0;
		padding: 0;
		background: #ffffff;
	}
	body {
		width: 640px;
		height: 400px;
		display: flex;
		align-items: center;
		justify-content: center;
		font: 16px/1.618 "Segoe UI", system-ui, sans-serif;
	}
	.slot {
		box-sizing: border-box;
		display: block;
		padding: 16px;
		background: #f1f5f9;
	}
	.box {
		box-sizing: border-box;
		width: 200px;
		height: 80px;
		padding: 8px;
		border: 1px solid #334155;
		background: #e2e8f0;
		color: #0f172a;
	}
</style>
</head>
<body data-id="root">
	<div class="slot" data-id="slot">
		<div class="box" data-id="greeting">Hello!</div>
	</div>
</body>
</html>
