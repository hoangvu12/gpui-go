<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
	html, body {
		margin: 0;
		padding: 0;
		background: #ffffff;
	}
	body {
		width: 640px;
		height: 400px;
		position: relative;
	}
	button {
		appearance: none;
		border: 0;
		margin: 0;
		padding: 0;
		display: block;
		position: absolute;
		width: 40px;
		height: 20px;
		background: #2563eb;
		outline: none;
	}
	#b3 {
		left: 0px;
		top: 0px;
	}
	#hint {
		position: fixed;
		inset: auto;
		margin: 0;
		border: 0;
		padding: 0;
		overflow: visible;
		left: 20px;
		top: 60px;
		width: 120px;
		height: 60px;
		background: #fde68a;
	}
</style>
</head>
<body data-id="root" data-events="keydown">
	<button id="b3" popovertarget="hint" data-id="b3"></button>
	<div id="hint" popover="hint" data-id="hint"></div>
</body>
</html>
