<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
	html, body {
		margin: 0;
		padding: 0;
		background: #ffffff;
	}
	body {
		width: 480px;
		height: 360px;
		display: flex;
		flex-direction: column;
		font: 16px/1.618 "Segoe UI", system-ui, sans-serif;
	}
	#a, #cover, #c {
		box-sizing: border-box;
		width: 120px;
		height: 60px;
		background: #e2e8f0;
	}
	#b {
		box-sizing: border-box;
		width: 120px;
		height: 30px;
		background: #94a3b8;
	}
	#a:focus, #cover:focus, #b:focus, #c:focus {
		background: #22c55e;
		outline: none;
	}
</style>
</head>
<body data-id="root">
	<div id="a" data-id="a" tabindex="0"></div>
	<div id="cover" data-id="cover" tabindex="0" inert>
		<div id="b" data-id="b" tabindex="0"></div>
	</div>
	<div id="c" data-id="c" tabindex="0"></div>
</body>
</html>
