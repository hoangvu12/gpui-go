<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
	html, body {
		margin: 0;
		padding: 0;
		background: #ffffff;
	}
	body {
		width: 320px;
		height: 240px;
		display: flex;
	}
	#boxed {
		box-sizing: border-box;
		width: 200px;
		height: 152px;
		margin-left: 12px;
		margin-top: 12px;
		border: 1px solid #000000;
		background: #ffffff;
	}
	#inner {
		box-sizing: border-box;
		width: 100%;
		height: 100%;
		background: #cccccc;
	}
</style>
</head>
<body>
	<div id="boxed" data-id="boxed"><div id="inner" data-id="inner"></div></div>
</body>
</html>
