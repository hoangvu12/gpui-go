<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
	html, body {
		margin: 0;
		padding: 0;
		background: #ffffff;
	}
	body {
		width: 320px;
		height: 240px;
		display: flex;
		flex-direction: column;
		align-items: flex-start;
		gap: 10px;
	}
	#go {
		width: 40px;
		height: 20px;
		background: #cccccc;
	}
	#width {
		width: 100px;
		height: 30px;
		background: #00ff00;
		transition: width 400ms linear;
	}
	body.on #width { width: 200px; }
</style>
</head>
<body>
	<div id="go" data-id="go"></div>
	<div id="width" data-id="width"></div>
	<script>
		document.getElementById("go").addEventListener("click", () => {
			document.body.classList.toggle("on");
		});
	</script>
</body>
</html>
