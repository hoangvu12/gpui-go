<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
	html, body {
		margin: 0;
		padding: 0;
		background: #ffffff;
	}
	body {
		width: 640px;
		height: 400px;
		display: flex;
		align-items: center;
		justify-content: center;
	}
	.p {
		box-sizing: border-box;
		width: 260px;
		height: 120px;
		padding: 20px;
		display: flex;
		justify-content: flex-start;
		background: #e2e8f0;
	}
	.c1 {
		box-sizing: border-box;
		width: 100px;
		height: 80px;
		background: #fde68a;
	}
	.c2 {
		box-sizing: border-box;
		width: 100px;
		height: 80px;
		background: #bbf7d0;
	}
</style>
</head>
<body data-id="root">
	<div class="p" data-id="p">
		<div class="c1" data-id="c1"></div>
		<div class="c2" data-id="c2"></div>
	</div>
</body>
</html>
