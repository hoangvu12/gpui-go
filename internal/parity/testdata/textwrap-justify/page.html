<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
	html, body {
		margin: 0;
		padding: 0;
		background: #ffffff;
	}
	body {
		width: 640px;
		height: 400px;
		display: flex;
		flex-direction: column;
		gap: 12px;
		padding: 16px;
		box-sizing: border-box;
		/* The pinned 25px line height (the textstyle fixtures' rule). */
		font: 16px/25px "Segoe UI", system-ui, sans-serif;
		color: #0f172a;
	}
	.row {
		box-sizing: border-box;
		width: 380px;
		padding: 8px;
		border: 1px solid #334155;
		background: #e2e8f0;
		display: flex;
	}
	.fill {
		box-sizing: border-box;
		background: #dbeafe;
	}

</style>
</head>
<body data-id="root">
	<div class="row" data-id="row-left"><span class="fill" data-id="span-left" style="display: block; width: 100%">The quick brown fox jumps over the lazy dog and then the dog jumps back over the fox again</span></div>
	<div class="row" data-id="row-justify"><span class="fill" data-id="span-justify" style="display: block; width: 100%; text-align: justify">The quick brown fox jumps over the lazy dog and then the dog jumps back over the fox again</span></div>
	<div class="row" data-id="row-justify-leaf"><span class="fill" data-id="span-justify-leaf" style="display: flex; width: 100%; text-align: justify">The quick brown fox jumps over the lazy dog and then the dog jumps back over the fox again</span></div>
</body>
</html>
